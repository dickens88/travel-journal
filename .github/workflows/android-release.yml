# 推送 v* 标签后，在 GitHub 上本地打包 APK 并发布到 Releases。
# 签名密钥存在 Expo 云端，需要在仓库 Settings → Secrets → Actions 里配置 EXPO_TOKEN。
name: Android APK Release

on:
  push:
    tags: ['v*']

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # 默认镜像只剩十几 GB，RN 的 Gradle 构建会撑满；删掉用不到的工具链（保留 Android SDK）
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/share/chromium /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google \
            /usr/local/julia* /usr/lib/jvm/java-{8,11,21,25}* "$AGENT_TOOLSDIRECTORY/PyPy" 2>/dev/null || true
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: 打包 APK
        run: |
          mkdir -p build-output
          eas build -p android --profile preview --local --non-interactive \
            --output build-output/travel-journal.apk

      - run: cp build-output/travel-journal.apk "build-output/travel-journal-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build-output/travel-journal-${{ github.ref_name }}.apk
